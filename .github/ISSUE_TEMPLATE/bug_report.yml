name: Bug Report
description: Report unexpected behavior
title: "[BUG]: "

labels:
  - type: bug

body:
- type: textarea
  id: description
  attributes:
    label: Description
    placeholder: Describe the issue
  validations:
    required: true

- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected behavior

- type: textarea
  id: logs
  attributes:
    label: Logs

- type: dropdown
  id: severity
  attributes:
    label: Severity
    options:
      - Critical
      - High
      - Medium
      - Low
  validations:
    required: true