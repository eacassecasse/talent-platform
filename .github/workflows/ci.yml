name: Continuous Integration Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: UV Installation
        uses: astral-sh/setup-uv@v5

      - name: Dependencies Synchronization
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Formatting validation
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: pnpm Setup
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Dependencies Installation
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
